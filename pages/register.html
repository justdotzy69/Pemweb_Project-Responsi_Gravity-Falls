<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Gravity Falls</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div class="main-container">
        <div class="external-title">SIGN UP</div>

        <div class="left-side"></div>

        <div class="right-side">
            <img src="../assets/logogravity.png" alt="Gravity Falls Logo" class="logo">

            <div class="form-content">
                <h2 class="form-title">REGISTER</h2>
                
                <form action="proses_register.php" method="POST">
                    <div class="input-group">
                        <input type="text" name="username" id="reg-username" placeholder=" " required>
                        <label for="reg-username">USERNAME</label>
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="reg-password" placeholder=" " required>
                        <label for="reg-password">PASSWORD</label>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    
                    <button type="submit" class="submit-btn">SIGN UP</button>
                </form>

                <div class="switch-link">
                    Sudah punya akun? <a href="login.html">Masuk disini</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
